[package]
name = "mise"
version = "0.1.0"
description = "Mise — Tauri shell around the local calendar-agent UI (tray + native notifications)"
edition = "2021"

# The lib name must not collide with the bin name ("mise"); the Tauri v2
# template convention is <name>_lib. main.rs calls mise_lib::run().
[lib]
name = "mise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
